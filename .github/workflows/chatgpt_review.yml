name: AI Code Review with Gate @85

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # paths:
    #   - 'cuda/**'
    #   - 'example.py'

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:

      - uses: actions/checkout@v4

      - name: Pin httpx (<0.28) via constraint
        run: echo "httpx<0.28" > ${{ runner.temp }}/constraints.txt

      - name: GPT Code Review
        id: gptreview
        # uses: sshnaidm/gpt-code-review-action@v2.1
        uses: cirolini/genai-code-review@v2
        env:                      
            PIP_CONSTRAINT: ${{ runner.temp }}/constraints.txt
        with:
          openai-key: ${{ secrets.OPENAI_API_KEY }}
          github_token:   ${{ secrets.GITHUB_TOKEN }}
          github_pr_id:   ${{ github.event.number }}
          mode:           patch
          language:       ko
          custom_prompt: |
            반드시 아래 JSON 하나만 출력하세요.
            {"score":<0-100>, "review":"<한글 코멘트>"}

      - name: Extract score & review
        id: extract                        
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number;
            const { data: cmts } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: pr,
              per_page: 100
            });

            const body = cmts.reverse()
              .find(c => c.user.type === 'Bot' && c.body.trim().startsWith('{'))
              ?.body.trim();

            if (!body) {
              core.warning('Bot comment with JSON not found');
              core.setOutput('score', '');
              core.setOutput('review', '');
              return;
            }

            let score = '', review = '';
            try {
              ({ score, review } = JSON.parse(body));
            } catch (e) {
              core.warning('JSON parse failed: ' + e);
            }
            core.setOutput('score', score);
            core.setOutput('review', review);
 
      - name: Add summary (always)
        if: always()
        run: |
          echo "### AI 코드 리뷰 결과" >> $GITHUB_STEP_SUMMARY
          echo "**점수:** ${{ steps.extract.outputs.score }}/100" >> $GITHUB_STEP_SUMMARY
          echo "**리뷰:** ${{ steps.extract.outputs.review }}"   >> $GITHUB_STEP_SUMMARY

      - name: Fail if score < 85
        if: ${{ steps.extract.outputs.score != '' }}
        run: |
          if [ "${{ steps.extract.outputs.score }}" -lt 85 ]; then
            echo "❌ 85점 미만 – 코드 수정을 요구합니다."
            exit 1
          fi
