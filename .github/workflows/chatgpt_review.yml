# .github/workflows/ai-review.yaml
name: AI Code Review & Score

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    # 0) PR 소스 체크아웃
    - uses: actions/checkout@v4

    # 1) GPT-기반 코드 리뷰 (코멘트 + 점수 포함)
    - name: Pin httpx (<0.28) via constraint
      run: echo "httpx<0.28" > ${{ runner.temp }}/constraints.txt

    - name: GPT Code Review
      id: gptreview
      uses: sshnaidm/gpt-code-review-action@v2.1
      env:                      # ← 환경변수 자리에 둡니다
          PIP_CONSTRAINT: ${{ runner.temp }}/constraints.txt
      with:
        openai-key: ${{ secrets.OPENAI_API_KEY }}
        prompt: |
          # 반드시 아래 두 줄만 출력하세요 (한글 사용).
          SCORE=<0~100 정수>
          REVIEW=<한 문장 요약 또는 개선점>
        model: gpt-3.5-turbo     # 필요 시 변경
        max-length: 4096
        post-if-error: false     # GPT 호출 실패해도 워크플로 계속

    # 2) 가장 최근 Bot 코멘트에서 SCORE 숫자만 추출
    - name: Extract SCORE
      id: parse
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.issue.number;
          const comments = (await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: pr, per_page: 100
          })).data.reverse();
          const bot = comments.find(c => c.user.type === 'Bot' && c.body.includes('**SCORE:**'));
          const m = bot?.body.match(/\*\*SCORE:\*\*\s*(\d+)/);
          core.setOutput('score', m ? m[1] : 'N/A');

    - name: Add summary
      if: steps.parse.outputs.score != 'N/A'
      run: |
        echo "### AI 코드 리뷰 점수" >> $GITHUB_STEP_SUMMARY
        echo "**${{ steps.parse.outputs.score }}/100**" >> $GITHUB_STEP_SUMMARY